spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8081}

# JWT settings
jwt.secret=change-me-very-secret-and-long-enough-for-hmac-sha
jwt.expiration-ms=86400000

# Admin credentials (hard-coded override for admin login)
admin.email=admin@shopease.com
admin.password=Admin@123

