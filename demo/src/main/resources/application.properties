spring.application.name=demo

server.port=8080

# Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mysql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=MyEcommerceJwtSecretKey2026ForDevelopmentOnly12345678901234567890
jwt.expiration-ms=86400000

# Admin
admin.email=admin@shopease.com
admin.password=Admin@123